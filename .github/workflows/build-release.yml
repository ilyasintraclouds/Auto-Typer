name: Build & Release Auto Typer

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read Version
        id: version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '0.0.0'
          }
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
        shell: pwsh

      - name: Build Onedir Bundle
        shell: cmd
        run: |
          pyinstaller --onedir --windowed --noconsole ^
            --icon=icon.ico ^
            --add-data "icon.ico;." ^
            --hidden-import=PyQt5.sip ^
            --hidden-import=pyautogui ^
            --clean --noconfirm ^
            --name="Auto Typer" ^
            Typer.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($iscc) {
            $isccPath = $iscc.Source
          } else {
            $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Using $isccPath"
          & "$isccPath" "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Typer-Installer
          path: installer_output/Auto-Typer-Setup-v${{ steps.version.outputs.version }}.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: installer_output/Auto-Typer-Setup-v${{ steps.version.outputs.version }}.exe
          tag_name: v${{ steps.version.outputs.version }}
          name: Auto Typer v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
