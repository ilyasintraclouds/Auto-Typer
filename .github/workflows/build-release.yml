name: Build & Release Auto Typer

# Releases are driven entirely by tags: nothing builds until a vX.Y.Z tag is
# pushed, and the version shipped is the one in that tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Version From Tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Tag '$tag' is not vMAJOR.MINOR.PATCH, for example v2.3.0."
          }
          $version = $tag.Substring(1)
          Write-Host "Releasing $tag as version $version"
          "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      - name: Check VERSION Matches Tag
        shell: pwsh
        run: |
          $source = Get-Content Typer.py -Raw
          if ($source -match '(?m)^VERSION\s*=\s*"([^"]+)"') {
            $appVersion = $Matches[1]
          } else {
            throw "No VERSION constant found in Typer.py."
          }
          $tagVersion = '${{ steps.version.outputs.version }}'
          if ($appVersion -ne $tagVersion) {
            throw "Typer.py has VERSION = '$appVersion' but the tag says '$tagVersion'. Bump VERSION, commit, and move the tag."
          }
          Write-Host "VERSION $appVersion matches the tag."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Onedir Bundle
        shell: cmd
        run: |
          pyinstaller --onedir --windowed --noconsole ^
            --icon=icon.ico ^
            --add-data "icon.ico;." ^
            --hidden-import=PyQt5.sip ^
            --hidden-import=pyautogui ^
            --clean --noconfirm ^
            --name="Auto Typer" ^
            Typer.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($iscc) {
            $isccPath = $iscc.Source
          } else {
            $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Using $isccPath"
          & "$isccPath" "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Typer-Installer-v${{ steps.version.outputs.version }}
          path: installer_output/Auto-Typer-Setup-v${{ steps.version.outputs.version }}.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/Auto-Typer-Setup-v${{ steps.version.outputs.version }}.exe
          tag_name: ${{ github.ref_name }}
          name: Auto Typer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
