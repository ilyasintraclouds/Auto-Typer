name: Build & Release Auto Typer

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read Version
        id: version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = 'preview'
          }
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
        shell: pwsh

      - name: Build EXE
        shell: cmd
        run: |
          pyinstaller --onefile --windowed --noconsole ^
            --icon=icon.ico ^
            --add-data "icon.ico;." ^
            --hidden-import=PyQt5.sip ^
            --hidden-import=pyautogui ^
            --clean ^
            --name="Auto Typer" ^
            Typer.py

      - name: Rename EXE with Version
        shell: pwsh
        run: |
          Copy-Item "dist\Auto Typer.exe" "dist\Auto Typer v${{ steps.version.outputs.version }}.exe"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Typer-EXE
          path: dist/Auto Typer v${{ steps.version.outputs.version }}.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/Auto Typer v${{ steps.version.outputs.version }}.exe
          tag_name: v${{ steps.version.outputs.version }}
          name: Auto Typer v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}